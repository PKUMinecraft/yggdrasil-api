name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read plugin name
        id: plugin
        run: echo "name=$(jq -r '.name' package.json)" >> "$GITHUB_OUTPUT"

      # On a tag push, the tag is the source of truth for the release version — package.json is
      # rewritten to match it here so the shipped zip is always correct, but this never gets
      # committed back to git; the workspace copy is only used to build the zip below.
      # On a manual (workflow_dispatch) run there's no tag, so package.json's own version is kept.
      - name: Resolve release version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            jq --arg v "$version" '.version = $v' package.json > package.json.tmp
            mv package.json.tmp package.json
          else
            version="$(jq -r '.version' package.json)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Build the zip outside the checkout so it can never include itself. The panel's importer
      # extracts the zip's top-level folder as-is directly into plugins/, with no stripping of
      # wrapper folders — so that top-level folder must be named exactly <name> (no version
      # suffix), containing the files directly, so every install lands at plugins/<name>/ and
      # every future release overwrites the same path instead of piling up version-named folders.
      # The zip *file* itself is still named <name>-<version>.zip so releases stay distinguishable.
      - name: Build plugin zip
        run: |
          name="${{ steps.plugin.outputs.name }}"
          version="${{ steps.version.outputs.version }}"
          mkdir -p "/tmp/build/$name" /tmp/dist
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='.gitignore' \
            --exclude='tmp' \
            --exclude='tests' \
            ./ "/tmp/build/$name/"
          (cd /tmp/build && zip -r "/tmp/dist/$name-$version.zip" "$name")

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.plugin.outputs.name }}-${{ steps.version.outputs.version }}
          path: /tmp/dist/${{ steps.plugin.outputs.name }}-${{ steps.version.outputs.version }}.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: /tmp/dist/${{ steps.plugin.outputs.name }}-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
